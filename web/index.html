<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Mapa nemovitostí v celé ČR přímo od majitelů – Sreality, Bezrealitky, Bazoš, UlovDomov.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<title>Nemovitosti od majitelů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one-screen app – filtry nahoře, mapa vlevo, seznam vpravo (na mobilu vysouvací) */
  :root {
    --bg: #f3f5f1;
    --panel: #ffffff;
    --ink: #1a2420;
    --muted: #5b6862;
    --line: #dde3de;
    --chip: #eaeee9;
    --chip-on: #1a2420;
    --chip-on-ink: #ffffff;
    --accent: #e23b3f;
    --warn: #a35f00;
    --sea: #dce6ea;
    --kraj-s: 62%;
    --kraj-l: 84%;
    --kraj-line: #ffffff;
    --dot-line: #ffffff;
    --city: #23302b;
    --city-halo: rgba(255, 255, 255, .92);
    --shadow: 0 8px 28px rgba(20, 35, 28, .16);
    --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101513; --panel: #171e1b; --ink: #e6ede9; --muted: #98a7a0; --line: #28322e; --chip: #222b27;
      --chip-on: #e6ede9; --chip-on-ink: #101513; --accent: #ff5a5e; --warn: #f0a640; --sea: #0d1418;
      --kraj-s: 22%; --kraj-l: 21%; --kraj-line: #0f1513; --dot-line: #0f1513; --city: #e6ede9;
      --city-halo: rgba(10, 16, 14, .9); --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101513; --panel: #171e1b; --ink: #e6ede9; --muted: #98a7a0; --line: #28322e; --chip: #222b27;
    --chip-on: #e6ede9; --chip-on-ink: #101513; --accent: #ff5a5e; --warn: #f0a640; --sea: #0d1418;
    --kraj-s: 22%; --kraj-l: 21%; --kraj-line: #0f1513; --dot-line: #0f1513; --city: #e6ede9;
    --city-halo: rgba(10, 16, 14, .9); --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-body); display: flex; flex-direction: column; overflow: hidden; }
  * { box-sizing: border-box; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 8px 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: 4px; }
  .brand h1 { font: 700 19px/1 var(--font-display); margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand h1 i { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .group > span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .chip { border: 0; background: var(--chip); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: color-mix(in srgb, var(--chip) 80%, var(--ink)); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
  .chip.all { background: transparent; color: var(--muted); padding: 4px 6px; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  label.f { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  select, input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; height: 30px; font-size: 13px; color: var(--ink); }
  input[type=text] { width: 96px; }
  select.hot { border-color: var(--accent); font-weight: 600; }
  label.chk { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
  #listbtn { display: none; }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #mapwrap { flex: 1; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; background: var(--sea); }
  aside { width: 360px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-h { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side-h b { font: 700 17px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  #rows { overflow-y: auto; flex: 1; min-height: 0; }
  .item { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .item:hover { background: color-mix(in srgb, var(--panel) 92%, var(--ink)); }
  .item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item .pr { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .item .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .a { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 3px; flex-wrap: wrap; }
  .more { padding: 14px; color: var(--muted); font-size: 12px; text-align: center; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; color: #fff; }
  .b-0 { background: #d81b2c; } .b-1 { background: #00a54f; } .b-2 { background: #2962ff; } .b-3 { background: #8e24aa; }
  .agebox { display: inline-block; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 30%, transparent); }
  .warn { color: var(--warn); font-weight: 600; }
  .item.has-img { display: flex; gap: 10px; }
  .item img { width: 88px; height: 66px; object-fit: cover; border-radius: 7px; flex: none; background: var(--chip); }
  .item .b { min-width: 0; flex: 1; }
  .pop img { display: block; width: calc(100% + 26px); max-width: none; height: 150px; object-fit: cover; margin: -11px -13px 6px; background: var(--chip); }
  #base { top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); display: flex; padding: 3px; gap: 2px; }
  #base button { border: 0; background: transparent; font-size: 12px; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
  #base button.on { background: var(--chip-on); color: var(--chip-on-ink); }
  .base-tiles .city { display: none; }

  .ov { position: absolute; z-index: 3; background: color-mix(in srgb, var(--panel) 94%, transparent); border-radius: 10px; box-shadow: var(--shadow); }
  #legend { left: max(10px, env(safe-area-inset-left, 0px)); bottom: 30px; padding: 8px 10px; font-size: 12px; }
  #legend .lt { font-weight: 600; margin-bottom: 4px; }
  #legend .li { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
  #legend .li i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--dot-line); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 35%, transparent); }
  #status { right: 10px; bottom: 30px; padding: 7px 11px; font-size: 12px; color: var(--muted); max-width: min(460px, calc(100% - 210px)); }
  #status b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #loading { inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 0; box-shadow: none; font-weight: 600; z-index: 4; }

  .city { font: 600 12px/1 var(--font-body); color: var(--city); white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 3px var(--city-halo), 0 0 3px var(--city-halo), 0 0 6px var(--city-halo); }
  .city.t1 { font-size: 15px; font-weight: 700; }
  .city.t2 { font-size: 13px; }
  .z-low .city.t3, .z-low .city.t2 { display: none; }
  .z-mid .city.t3 { display: none; }

  .maplibregl-map { font: 12px/1.4 var(--font-body); }
  .maplibregl-popup { z-index: 6; }
  .maplibregl-popup-content { background: var(--panel); color: var(--ink); padding: 0; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--panel); }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip, .maplibregl-popup-anchor-top-left .maplibregl-popup-tip, .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--panel); }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--panel); }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--panel); }
  .maplibregl-popup-close-button { font-size: 18px; padding: 2px 8px; color: var(--muted); }
  .maplibregl-ctrl-group { background: var(--panel); }
  .maplibregl-ctrl-group button + button { border-top-color: var(--line); }
  .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted); }
  :root[data-theme="dark"] .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(.88); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(.88); } }

  .pop { width: 270px; font-size: 13px; padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 3px; }
  .pop .pr { font: 700 19px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
  .pop .mt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pop .l { color: var(--muted); font-size: 12px; }
  .pop .ft { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; font-size: 12px; color: var(--muted); }
  .pop .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pop a.go, .multi a.go { display: block; margin-top: 8px; text-align: center; background: var(--chip-on); color: var(--chip-on-ink); text-decoration: none; padding: 8px; border-radius: 8px; font-weight: 600; }
  .multi { width: 300px; max-height: 340px; overflow-y: auto; }
  .multi .h { padding: 10px 13px; font-weight: 700; border-bottom: 1px solid var(--line); }
  .multi a.r { display: block; padding: 8px 13px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .multi a.r:hover { background: color-mix(in srgb, var(--panel) 92%, var(--ink)); }
  .multi .pr { font-weight: 700; font-variant-numeric: tabular-nums; }
  .multi .s { font-size: 12px; color: var(--muted); }

  /* Tabulka: překryje mapu i seznam, filtry nahoře dál platí */
  #tblbtn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  #tblbtn svg { width: 14px; height: 14px; }
  #tbl { position: absolute; inset: 0; z-index: 7; background: var(--panel); display: flex; flex-direction: column; }
  .tbl-h { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tbl-h .n b { font: 700 17px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .tbl-h .n span { color: var(--muted); }
  .tbl-h .note { color: var(--muted); font-size: 12px; }
  #tclose { margin-left: auto; }
  .tbl-w { flex: 1; min-height: 0; overflow: auto; }
  #tbl table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 900px; font-size: 13px; }
  #tbl th { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line); padding: 0; text-align: left; white-space: nowrap; }
  #tbl th button { border: 0; background: none; width: 100%; padding: 9px 10px; text-align: inherit; cursor: pointer;
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  #tbl th button:hover, #tbl th[aria-sort] button { color: var(--ink); }
  #tbl th.num { text-align: right; }
  #tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #tbl td:first-child, #tbl th:first-child button { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  #tbl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tbl td.t { min-width: 250px; max-width: 420px; }
  #tbl td.t a { color: var(--ink); font-weight: 600; text-decoration: none; }
  #tbl td.t a:hover { color: var(--accent); text-decoration: underline; }
  #tbl td .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #tbl tbody tr:hover { background: color-mix(in srgb, var(--panel) 94%, var(--ink)); }
  #tmore { display: block; margin: 14px auto 20px; }

  @media (max-width: 900px) {
    aside { position: absolute; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 5; box-shadow: var(--shadow); display: none; }
    aside.open { display: flex; }
    #listbtn { display: inline-block; }
    .row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
    .row > * { flex: none; }
    .group { flex-wrap: nowrap; }
    #legend { display: none; }
    #status { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: 26px; max-width: none; }
    .brand small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<header>
  <div class="row">
    <div class="brand"><h1><i></i>Nemovitosti od majitelů</h1><small id="stamp">celá ČR, bez realitek</small></div>
    <button class="chip" id="tblbtn" type="button" aria-pressed="false" aria-controls="tbl">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 6.5h13M1.5 10h13M6 6.5v7"/></svg>Tabulka</button>
    <div class="group" id="g-offer"></div>
    <div class="sep"></div>
    <div class="group" id="g-cat"><span>Typ</span></div>
    <div class="sep"></div>
    <div class="group" id="g-src"><span>Zdroj</span></div>
    <button class="chip" id="listbtn" type="button">Seznam</button>
  </div>
  <div class="row">
    <div class="group" id="g-disp"><span>Dispozice</span></div>
    <div class="sep"></div>
    <label class="f" for="age">Přidáno za posledních <select id="age"></select></label>
    <label class="f" for="pmin">Cena <input type="text" id="pmin" placeholder="od (např. 2m)" inputmode="numeric"></label>
    <label class="f" for="pmax">– <input type="text" id="pmax" placeholder="do" inputmode="numeric"></label>
    <label class="f" for="amin">Plocha od <input type="text" id="amin" placeholder="m²" inputmode="numeric" style="width:64px"></label>
    <label class="f" for="color">Barva teček
      <select id="color"><option value="age">podle stáří</option><option value="ppm">podle ceny za m²</option><option value="src">podle zdroje</option></select>
    </label>
    <label class="f" for="region">Oblast <select id="region"></select></label>
    <label class="chk" for="maybe" title="Inzeráty, u kterých si filtr není jistý, že nejsou od realitky (označené ⚠)"><input type="checkbox" id="maybe" checked> i nejisté ⚠</label>
  </div>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="ov" id="base" role="group" aria-label="Podklad mapy">
      <button type="button" data-b="osm">Barevná</button><button type="button" data-b="voyager">Světlá</button><button type="button" data-b="sat">Satelit</button><button type="button" data-b="kraje">Kraje</button>
    </div>
    <div class="ov" id="legend"></div>
    <div class="ov" id="status">Načítám…</div>
    <div class="ov" id="loading">Načítám inzeráty…</div>
  </div>
  <aside id="side">
    <div class="side-h">
      <div><b id="cnt">0</b> <span>ve výřezu mapy</span></div>
      <select id="sort" aria-label="Řazení">
        <option value="new">nejnovější</option><option value="cheap">nejlevnější</option><option value="ppm">nejlevnější za m²</option>
      </select>
    </div>
    <div id="rows"></div>
  </aside>
  <section id="tbl" hidden aria-label="Tabulka inzerátů">
    <div class="tbl-h">
      <div class="n"><b id="tcnt">0</b> <span>inzerátů podle filtrů</span></div>
      <div class="group" id="tscope"><button type="button" class="chip" data-v="view">Ve výřezu mapy</button><button type="button" class="chip" data-v="all">Celá ČR</button></div>
      <span class="note">Telefon a jméno prodávajícího najdeš po otevření inzerátu (klikni na název).</span>
      <button type="button" class="chip" id="tclose">Zpět na mapu ✕</button>
    </div>
    <div class="tbl-w">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="more" id="tempty" hidden>Filtrům nic neodpovídá. Zkus delší dobu „Přidáno za posledních“ nebo „Celá ČR“.</div>
      <button type="button" class="chip" id="tmore" hidden></button>
    </div>
  </section>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("cs-CZ");
const IS_TOUCH = matchMedia("(hover: none)").matches;
const SRC_NAME = ["Sreality", "Bezrealitky", "Bazoš", "UlovDomov"];
const SRC_COL = ["#d81b2c", "#00a54f", "#2962ff", "#8e24aa"];
const CATS = [["byt", "Byty"], ["dum", "Domy"], ["pozemek", "Pozemky"], ["chata", "Chaty a chalupy"], ["komercni", "Komerční"], ["garaz", "Garáže"], ["ostatni", "Ostatní"]];
const DISPS = [["1+kk"], ["1+1"], ["2+kk"], ["2+1"], ["3+kk"], ["3+1"], ["4+kk"], ["4+1"], ["5+", "5 a více"], ["atyp", "Atyp."], ["?", "Neuvedeno"]];
const AGES = [[1, "1 hodinu"], [3, "3 hodiny"], [10, "10 hodin"], [24, "24 hodin"], [72, "3 dny"], [168, "7 dní"], [336, "14 dní"], [720, "30 dní"], [0, "kdykoliv"]];
const AGE_COLS = [[1, "#ff1744", "do 1 hodiny"], [3, "#ff6d00", "do 3 hodin"], [10, "#ffc400", "do 10 hodin"], [24, "#aeea00", "do 24 hodin"],
  [72, "#00c853", "do 3 dnů"], [168, "#00b8d4", "do týdne"], [720, "#2962ff", "do měsíce"], [Infinity, "#aa00ff", "starší"]];
const PPM_SALE = [[40000, "#00c853"], [60000, "#64dd17"], [80000, "#ffd600"], [100000, "#ff9100"], [130000, "#ff3d00"], [Infinity, "#c51162"]];
const PPM_RENT = [[150, "#00c853"], [200, "#64dd17"], [250, "#ffd600"], [300, "#ff9100"], [400, "#ff3d00"], [Infinity, "#c51162"]];
const GREY = "#9aa3ad";
const KRAJ_HUES = [4, 48, 140, 205, 280, 25, 170, 330, 95, 60, 190, 230, 120, 300];
const REGIONS = [
  ["Celá ČR", [12.09, 48.55, 18.86, 51.06]], ["Praha", [14.22, 49.94, 14.71, 50.18]], ["Brno a okolí", [16.38, 49.08, 16.84, 49.32]],
  ["Ostrava", [18.1, 49.73, 18.4, 49.92]], ["Plzeň", [13.27, 49.68, 13.48, 49.8]], ["Olomouc", [17.18, 49.55, 17.33, 49.64]],

  const vis = filtered.filter(it => b.contains([it.lo, it.la]));
  if (F.sort === "new") vis.sort((a, b) => (b.ad || 0) - (a.ad || 0));
  else if (F.sort === "cheap") vis.sort((a, b) => (a.p || Infinity) - (b.p || Infinity));
  else vis.sort((a, b) => (a.m || Infinity) - (b.m || Infinity));
  $("cnt").textContent = nf.format(vis.length);
  $("listbtn").textContent = `Seznam (${nf.format(vis.length)})`;
  const shown = vis.slice(0, 200);
  $("rows").innerHTML = shown.map(it => `<a class="item${it.img ? " has-img" : ""}" href="${esc(it.u)}" target="_blank" rel="noopener" data-k="${it.k}">
    ${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}<div class="b">
    <div class="top"><span class="pr">${esc(priceText(it))}</span><span class="badge b-${it.s}">${SRC_NAME[it.s]}</span></div>
    <div class="t">${esc(it.t)}</div>
    <div class="s">${esc([sizeText(it), ppmText(it)].filter(Boolean).join(" · "))}</div>
    <div class="s">${esc(it.loc)}</div>
    <div class="a"><span class="agebox" style="background:${colorOf(it)}"></span>${esc(ageText(it))}${it.maybe ? ' <span class="warn">⚠ možná realitka</span>' : ""}</div></div></a>`).join("")
    + (vis.length > shown.length ? '<div class="more">Zobrazeno prvních 200, přibliž mapu pro další.</div>' : "")
    + (!vis.length ? '<div class="more">V tomto výřezu nic neodpovídá filtrům.<br>Zkus delší dobu „Přidáno za posledních“ nebo oddal mapu.</div>' : "");
}
$("rows").addEventListener("mouseover", e => { const a = e.target.closest(".item"); if (a) setHover(+a.dataset.k); });
$("rows").addEventListener("mouseleave", () => setHover(null));
function renderLegend() {
  let h;
  if (F.color === "age") h = '<div class="lt">Přidáno (od stažení dat)</div>' + AGE_COLS.map(([, c, l]) => `<div class="li"><i style="background:${c}"></i>${l}</div>`).join("");
  else if (F.color === "src") h = '<div class="lt">Zdroj</div>' + SRC_NAME.map((n, i) => `<div class="li"><i style="background:${SRC_COL[i]}"></i>${n}</div>`).join("");
  else {
    const rent = F.offer.size === 1 && F.offer.has("pronajem"), sc = rent ? PPM_RENT : PPM_SALE;
    let prev = 0;
    h = `<div class="lt">Cena za m²${rent ? " (měsíčně)" : ""}</div>` + sc.map(([lim, c]) => {
      const l = lim === Infinity ? `nad ${nf.format(prev)} Kč` : `${nf.format(prev)} – ${nf.format(lim)} Kč`; prev = lim;
      return `<div class="li"><i style="background:${c}"></i>${l}</div>`;
    }).join("") + `<div class="li"><i style="background:${GREY}"></i>neznámá</div>`;
  }
  $("legend").innerHTML = h;
}
function renderStatus() {
  const by = [0, 0, 0, 0];
  for (const it of items) by[it.s]++;
  $("status").innerHTML = `Na mapě <b>${nf.format(filtered.length)}</b> z ${nf.format(items.length)} inzerátů od majitelů · `
    + SRC_NAME.map((n, i) => `${n} ${nf.format(by[i])}`).join(" · ") + `<br>Stav k ${dateText(AT, true)}, odkazy vedou na původní inzeráty.`;
}

// ───── tabulka ─────
const T_PAGE = 300;
const T = { open: false, limit: T_PAGE };
const CAT_ONE = { byt: "Byt", dum: "Dům", pozemek: "Pozemek", chata: "Chata / chalupa", komercni: "Komerční prostor", garaz: "Garáž", ostatni: "Ostatní" };
const TCOLS = [["t", "Inzerát"], ["loc", "Kde"], ["c", "Typ"], ["p", "Cena", 1], ["a", "Velikost", 1], ["m", "Kč/m²", 1], ["ad", "Přidáno", 1]];
const coll = new Intl.Collator("cs");
function typeText(it) { return [CAT_ONE[it.c] || it.c, it.d && it.d !== "?" ? it.d : ""].filter(Boolean).join(" "); }
function locText(it) { return (it.loc || "").replace(/^[\s,–-]+/, ""); }
const SORTV = { t: it => it.t || null, loc: it => locText(it) || null, c: it => typeText(it), p: it => it.p || null,
  a: it => it.a || it.l || null, m: it => it.m || null, ad: it => it.ad || null };
function addedShort(it) {
  if (!it.ad) return "neznámo";
  const h = (AT - it.ad) / 36e5, pre = it.pr === "approx" ? "≈ " : "";
  if (it.pr === "live" || it.pr === "approx") {
    if (h < 1) return pre + "před " + Math.max(1, Math.round(h * 60)) + " min";
    if (h < 24) return pre + "před " + Math.round(h) + " h";
  }
  return pre + dateText(it.ad, false);
}
function tableRows() {
  let rows = filtered;
  if (F.tscope === "view") { const b = map.getBounds(); rows = rows.filter(it => b.contains([it.lo, it.la])); }
  const get = SORTV[F.tkey] || SORTV.ad, dir = F.tdir, str = F.tkey === "t" || F.tkey === "loc" || F.tkey === "c";
  return rows.map(it => [get(it), it]).sort((x, y) => {
    if (x[0] == null) return y[0] == null ? 0 : 1;   // bez hodnoty vždy na konec
    if (y[0] == null) return -1;
    return dir * (str ? coll.compare(x[0], y[0]) : x[0] - y[0]);
  }).map(x => x[1]);
}
function renderTable() {
  if (!T.open || !D) return;
  const rows = tableRows(), shown = rows.slice(0, T.limit);
  $("tcnt").textContent = nf.format(rows.length);
  document.querySelectorAll("#tscope .chip").forEach(c => c.classList.toggle("on", c.dataset.v === F.tscope));
  $("thead").innerHTML = "<tr>" + TCOLS.map(([k, l, num]) => {
    const on = F.tkey === k;
    return `<th class="${num ? "num" : ""}"${on ? ` aria-sort="${F.tdir > 0 ? "ascending" : "descending"}"` : ""}><button type="button" data-k="${k}">${l}${on ? (F.tdir > 0 ? " ↑" : " ↓") : ""}</button></th>`;
  }).join("") + "</tr>";
  $("tbody").innerHTML = shown.map(it => `<tr>
    <td class="t"><a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t || "Inzerát na " + SRC_NAME[it.s])}</a>
      <div class="sub"><span class="badge b-${it.s}">${SRC_NAME[it.s]}</span>${it.maybe ? ' <span class="warn">⚠ možná realitka</span>' : ""}</div></td>
    <td>${esc(locText(it) || "neuvedeno")}${it.ap ? '<div class="sub">poloha přibližná</div>' : ""}</td>
    <td>${esc(typeText(it))}<div class="sub">${it.o === "pronajem" ? "pronájem" : "prodej"}</div></td>
    <td class="num"><b>${esc(priceText(it))}</b></td>
    <td class="num">${esc(sizeText(it) || "neuvedeno")}</td>
    <td class="num">${it.m ? nf.format(Math.round(it.m)) + (it.o === "pronajem" ? '<div class="sub">měsíčně</div>' : "") : "–"}</td>
    <td class="num"><span class="agebox" style="background:${ageColor(it)}"></span> ${esc(addedShort(it))}</td></tr>`).join("");
  $("tempty").hidden = rows.length > 0;
  $("tmore").hidden = rows.length <= shown.length;
  $("tmore").textContent = `Zobrazit dalších ${nf.format(Math.min(T_PAGE, rows.length - shown.length))} (zatím ${nf.format(shown.length)} z ${nf.format(rows.length)})`;
}
function setTable(open) {
  T.open = open; T.limit = T_PAGE;
  $("tbl").hidden = !open;
  $("tblbtn").classList.toggle("on", open);
  $("tblbtn").setAttribute("aria-pressed", String(open));
  if (open) { closePopup(); $("side").classList.remove("open"); renderTable(); $("tbl").querySelector(".tbl-w").scrollTop = 0; }
}
$("tblbtn").onclick = () => setTable(!T.open);
$("tclose").onclick = () => setTable(false);
document.addEventListener("keydown", e => { if (e.key === "Escape" && T.open) setTable(false); });
$("tscope").onclick = e => {
  const c = e.target.closest(".chip"); if (!c) return;
  F.tscope = c.dataset.v; persist(); T.limit = T_PAGE; renderTable();
};
$("thead").onclick = e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  const k = b.dataset.k;
  if (F.tkey === k) F.tdir = -F.tdir; else { F.tkey = k; F.tdir = k === "ad" ? -1 : 1; }
  persist(); T.limit = T_PAGE; renderTable();
};
$("tmore").onclick = () => { T.limit += T_PAGE; renderTable(); };
</script>
</body>
</html>
