# Každou hodinu stáhne nové inzeráty a zveřejní mapu na GitHub Pages.
# Jednou týdně navíc obnoví 60denní lhůtu, po které by GitHub
# automatické spouštění ve veřejném repozitáři sám vypnul.
name: Aktualizace mapy

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "43 4 * * 1"   # pondělí 4:43 UTC: pojistka proti vypnutí
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  aktualizace:
    if: github.event.schedule != '43 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: aktualizace
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obnovit uložený stav
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stav-${{ github.run_id }}
          restore-keys: stav-

      - name: Stáhnout novinky
        env:
          BUDGET_MIN: "25"
        run: python3 run_once.py _site

      - name: Uložit stav
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: stav-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Znovu potvrdí zapnutí tohoto workflow. Tím se vynuluje počítadlo
  # nečinnosti, takže hodinové aktualizace nepřestanou běžet ani po
  # 60 dnech bez změn v repozitáři.
  pojistka:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Udržet automatické spouštění zapnuté
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/aktualizace.yml/enable"
